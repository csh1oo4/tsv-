plugins {
    id 'com.android.application'
}

android {
    namespace 'com.choi.filemanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.choi.filemanager"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Fixed key: the certificate is identical in every build, so v1.1 / v1.2 install as an
    // update over the previous version instead of needing an uninstall first.
    signingConfigs {
        debug {
            storeFile file('filemanager-fixed.p12')
            storeType 'PKCS12'
            storePassword 'fmfixed123'
            keyAlias 'filemanager'
            keyPassword 'fmfixed123'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // androidx.core is here only for FileProvider (handing a file to another app).
    implementation 'androidx.core:core:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}

// The repository has one shared "Build APK" workflow, so the checks hang off assembleDebug:
// a debug APK only counts as built once the JS structure tests, the JVM unit tests and the
// signature check have passed.
tasks.register('jsTests', Exec) {
    group = 'verification'
    description = 'Runs the JS logic and structure tests (skipped when node is absent).'
    workingDir rootProject.projectDir
    commandLine 'sh', '-c',
            'if command -v node >/dev/null 2>&1; then node tools/tests/run.js; ' +
            'else echo "node not found - JS tests skipped"; fi'
}

tasks.register('verifyApkSignature') {
    group = 'verification'
    description = 'Confirms the debug APK is signed with app/filemanager-fixed.p12.'
    doLast {
        def apk = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        if (!apk.exists()) {
            throw new GradleException("APK not found: ${apk}")
        }
        def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (!sdk) {
            println 'ANDROID_HOME not set - skipping apksigner check'
            return
        }
        def candidates = file("${sdk}/build-tools").listFiles()
                ?.findAll { it.isDirectory() }?.sort { it.name }
        def apksigner = null
        candidates?.each { dir ->
            def candidate = new File(dir, 'apksigner')
            if (candidate.exists()) {
                apksigner = candidate
            }
        }
        if (apksigner == null) {
            println 'apksigner not found - skipping signature check'
            return
        }
        def output = new ByteArrayOutputStream()
        exec {
            commandLine apksigner.absolutePath, 'verify', '--verbose', '--print-certs', apk.absolutePath
            standardOutput = output
            errorOutput = output
        }
        def text = output.toString('UTF-8')
        println text
        if (!text.contains('CN=NAS FileManager')) {
            throw new GradleException('APK is not signed with the fixed NAS FileManager key')
        }
        // The v1.0 certificate, byte for byte: v1.1 installs over it as an update.
        if (!text.toLowerCase().contains('42297011297aed34a76fd5325267f9f30c52258da96835f1d15179475f494623')) {
            throw new GradleException('APK certificate fingerprint does not match v1.0')
        }
        println 'APK signed with the fixed NAS FileManager key (sha256 42297011…)'
    }
}

tasks.matching { it.name == 'testDebugUnitTest' }.configureEach {
    dependsOn 'jsTests'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.matching { it.name == 'assembleDebug' }.configureEach {
    dependsOn 'testDebugUnitTest'
    finalizedBy 'verifyApkSignature'
}

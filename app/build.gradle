plugins {
    id 'com.android.application'
}

android {
    namespace 'com.choi.filemanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.choi.filemanager"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed key: the certificate is identical in every build, so v1.1 / v1.2 install as an
    // update over the previous version instead of needing an uninstall first.
    signingConfigs {
        debug {
            storeFile file('filemanager-fixed.p12')
            storeType 'PKCS12'
            storePassword 'fmfixed123'
            keyAlias 'filemanager'
            keyPassword 'fmfixed123'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // androidx.core is here only for FileProvider (handing a file to another app).
    implementation 'androidx.core:core:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}

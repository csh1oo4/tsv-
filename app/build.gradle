plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tsv.dutycalendar'
    compileSdk 34

    defaultConfig {
        applicationId "com.tsv.dutycalendar"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "2.4.3"
    }

    // Fixed debug key: keeps the signing certificate identical across every build so
    // updates install over the previous version without uninstalling.
    signingConfigs {
        debug {
            storeFile file('tsv-duty-fixed.p12')
            storeType 'PKCS12'
            storePassword 'tsvduty123'
            keyAlias 'tsvduty'
            keyPassword 'tsvduty123'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // androidx.core is here only for FileProvider, which hands the downloaded update
    // APK to the system package installer (see UpdaterBridge in MainActivity).
    implementation 'androidx.core:core:1.12.0'
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NAS 파일매니저</title>
<style>
    :root {
        --bg: #F6F8FB;
        --card: #FFFFFF;
        --text: #16223A;
        --muted: #6B7A90;
        --line: #E5EAF2;
        --accent: #2F6FED;
        --accent-soft: #E9F0FF;
        --accent-dark: #1E4FC0;
        --danger: #E5484D;
        --ok: #16A34A;
        --radius: 16px;
        --tab-h: 56px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Samsung Sans", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
    }

    body { display: flex; flex-direction: column; }

    button {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
    }

    /* ---------------------------------------------------------------- header */

    #topbar {
        flex: 0 0 auto;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: calc(10px + env(safe-area-inset-top)) 16px 0 16px;
        position: relative;
        z-index: 20;
    }

    .brandline {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
    }

    .brandline h1 {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.3px;
        margin: 0;
    }

    .brandline .sub {
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #C7D0DE;
        display: inline-block;
    }

    .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14); }

    .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 10px;
        scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
        flex: 0 0 auto;
        padding: 9px 14px;
        border-radius: 12px;
        font-size: 14.5px;
        font-weight: 700;
        color: var(--muted);
        background: #F1F4F9;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background .15s, color .15s;
        white-space: nowrap;
    }

    .tab.active { background: var(--accent); color: #fff; }
    .tab .badge {
        font-size: 10.5px;
        background: rgba(255,255,255,.28);
        padding: 1px 6px;
        border-radius: 8px;
    }
    .tab:not(.active) .badge { background: #E2E8F2; color: var(--muted); }

    /* ------------------------------------------------------------------ main */

    main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .screen { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
    .screen.active { display: flex; }

    /* path bar */
    #pathbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 6px 12px;
    }

    .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        font-size: 17px;
        color: var(--text);
        flex: 0 0 auto;
    }

    .icon-btn:disabled { opacity: .4; }
    .icon-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    #crumbs {
        flex: 1 1 auto;
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        white-space: nowrap;
        padding: 2px 0;
    }

    #crumbs::-webkit-scrollbar { display: none; }

    .crumb {
        font-size: 13.5px;
        color: var(--muted);
        padding: 6px 8px;
        border-radius: 9px;
        background: #EDF1F8;
        flex: 0 0 auto;
        max-width: 40vw;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .crumb.last { color: var(--text); font-weight: 800; background: var(--accent-soft); }

    /* quick folders */
    #quick {
        flex: 0 0 auto;
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 2px 12px 8px 12px;
        scrollbar-width: none;
    }

    #quick::-webkit-scrollbar { display: none; }

    .chip {
        flex: 0 0 auto;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent-dark);
        background: var(--accent-soft);
        padding: 7px 12px;
        border-radius: 999px;
        white-space: nowrap;
    }

    .chip.ghost { background: #EEF2F8; color: var(--muted); }

    /* toolbar */
    #toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 8px 12px;
        flex-wrap: wrap;
    }

    .seg {
        display: flex;
        background: #EDF1F8;
        border-radius: 12px;
        padding: 3px;
        gap: 2px;
    }

    .seg button {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        padding: 6px 11px;
        border-radius: 9px;
    }

    .seg button.on { background: var(--card); color: var(--accent-dark); box-shadow: 0 1px 3px rgba(20,40,80,.12); }

    #sort {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        background: #EDF1F8;
        border-radius: 12px;
        padding: 8px 10px;
        border: 0;
        appearance: none;
    }

    #searchwrap {
        flex: 1 1 140px;
        display: none;
        align-items: center;
        gap: 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 10px;
        height: 38px;
    }

    #searchwrap.on { display: flex; }

    #search {
        flex: 1 1 auto;
        border: 0;
        outline: 0;
        font-size: 14.5px;
        background: transparent;
        color: var(--text);
        min-width: 0;
    }

    #statusline {
        flex: 0 0 auto;
        padding: 0 16px 6px 16px;
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        gap: 8px;
        align-items: center;
    }

    #statusline .sel { color: var(--accent-dark); font-weight: 800; }

    /* file list */
    #list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 12px calc(24px + env(safe-area-inset-bottom)) 12px;
    }

    #list.grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 10px;
        align-content: start;
    }

    #list.list { display: block; }

    .cell {
        position: relative;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        overflow: hidden;
        transition: transform .08s, border-color .12s, box-shadow .12s;
    }

    .cell:active { transform: scale(.985); }

    .cell.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(47,111,237,.22);
    }

    /* grid cell */
    #list.grid .cell {
        display: flex;
        flex-direction: column;
    }

    .thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #EEF2F8 center/cover no-repeat;
        display: grid;
        place-items: center;
        overflow: hidden;
    }

    .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .thumb .glyph { font-size: 32px; opacity: .8; }

    .tag {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: rgba(12, 20, 34, .62);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 3px;
        backdrop-filter: blur(2px);
    }

    #list.grid .info {
        padding: 7px 9px 9px 9px;
    }

    .name {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-all;
    }

    .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        display: flex;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
    }

    /* list cell */
    #list.list .cell {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        margin-bottom: 8px;
    }

    #list.list .thumb {
        width: 52px;
        height: 52px;
        aspect-ratio: auto;
        border-radius: 11px;
        flex: 0 0 auto;
    }

    #list.list .thumb .glyph { font-size: 24px; }
    #list.list .info { flex: 1 1 auto; min-width: 0; }
    #list.list .name { font-size: 15px; -webkit-line-clamp: 1; }
    #list.list .meta { margin-top: 4px; font-size: 12px; }

    .check {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: rgba(12,20,34,.35);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 12px;
        opacity: 0;
        transition: opacity .12s;
    }

    #list.selecting .check { opacity: 1; }
    .cell.selected .check { background: var(--accent); border-color: #fff; }

    #empty {
        flex: 1 1 auto;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--muted);
        padding: 40px 24px;
        text-align: center;
    }

    #empty.on { display: flex; }
    #empty .big { font-size: 44px; }
    #empty .title { font-size: 16px; font-weight: 800; color: var(--text); }
    #empty .hint { font-size: 13px; line-height: 1.55; max-width: 300px; }

    /* selection bar */
    #selbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        transform: translateY(110%);
        transition: transform .18s ease;
        background: rgba(255,255,255,.98);
        border-top: 1px solid var(--line);
        box-shadow: 0 -8px 24px rgba(20, 40, 80, .10);
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom)) 10px;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        z-index: 30;
    }

    #selbar.on { transform: translateY(0); }

    .act {
        flex: 1 0 auto;
        min-width: 62px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        padding: 6px 8px;
        border-radius: 12px;
    }

    .act .ic { font-size: 19px; line-height: 1; }
    .act.primary { color: var(--accent-dark); background: var(--accent-soft); }
    .act.danger { color: var(--danger); }
    .act:disabled { opacity: .4; }

    /* settings */
    #view-settings { overflow-y: auto; padding: 14px 14px calc(30px + env(safe-area-inset-bottom)) 14px; }

    .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
    }

    .card h2 {
        font-size: 15px;
        font-weight: 800;
        margin: 0 0 4px 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .card .desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }

    .field { margin-bottom: 10px; }

    .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 5px;
    }

    .field input, .field select {
        width: 100%;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 12px;
        font-size: 15px;
        background: #FBFCFE;
        color: var(--text);
        outline: none;
    }

    .field input:focus { border-color: var(--accent); background: #fff; }

    .row { display: flex; gap: 8px; }

    .row > * { flex: 1 1 auto; }

    .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
        font-weight: 600;
    }

    .switch small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }

    .toggle {
        width: 48px;
        height: 28px;
        border-radius: 999px;
        background: #D8DEE9;
        position: relative;
        flex: 0 0 auto;
        transition: background .15s;
    }

    .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgba(0,0,0,.2);
        transition: transform .15s;
    }

    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(20px); }

    .btn {
        height: 44px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 14.5px;
        font-weight: 800;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn.ghost { background: #EEF2F8; color: var(--text); }
    .btn.line { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .btn.danger { background: #FDECEC; color: var(--danger); }
    .btn:disabled { opacity: .5; }

    .stat-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
        padding: 7px 0;
        border-top: 1px solid var(--line);
    }

    .stat-row b { color: var(--text); font-weight: 700; }

    .server-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 8px;
        font-size: 13px;
        background: #FBFCFE;
    }

    .server-chip .grow { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .server-chip small { color: var(--muted); display: block; font-size: 11px; }

    /* connect screen inside the NAS tab */
    #connect {
        padding: 16px;
        overflow-y: auto;
    }

    /* ---------------------------------------------------------------- viewer */

    .overlay {
        position: fixed;
        inset: 0;
        background: #0A0E16;
        z-index: 60;
        display: none;
        flex-direction: column;
        touch-action: none;
    }

    .overlay.on { display: flex; }

    .ovtop {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
        color: #fff;
        background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
        position: relative;
        z-index: 3;
    }

    .ovtop .title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .ovtop .count { font-size: 12px; opacity: .75; flex: 0 0 auto; }

    .ovbtn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #fff;
        background: rgba(255,255,255,.14);
        font-size: 18px;
        flex: 0 0 auto;
    }

    .stage {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        position: relative;
    }

    .stage img {
        max-width: 100%;
        max-height: 100%;
        transform-origin: center center;
        will-change: transform;
        transition: transform .05s linear;
        user-select: none;
        -webkit-user-drag: none;
    }

    .ovbottom {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 10px 14px calc(14px + env(safe-area-inset-bottom)) 14px;
        background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0));
    }

    .ovbottom .btn { background: rgba(255,255,255,.16); color: #fff; height: 42px; }

    #playerVideo {
        width: 100%;
        max-height: 100%;
        background: #000;
    }

    /* ---------------------------------------------------------------- modal */

    #modal, #progress {
        position: fixed;
        inset: 0;
        background: rgba(12, 20, 34, .45);
        z-index: 80;
        display: none;
        align-items: flex-end;
        justify-content: center;
        padding: 0;
    }

    #modal.on, #progress.on { display: flex; }

    .sheet {
        width: 100%;
        max-height: 86vh;
        background: var(--card);
        border-radius: 20px 20px 0 0;
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        animation: rise .18s ease;
    }

    @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }

    .sheet h3 { margin: 0; font-size: 16.5px; font-weight: 800; }
    .sheet .body { overflow-y: auto; font-size: 14px; line-height: 1.55; color: var(--muted); white-space: pre-line; }
    .sheet .foot { display: flex; gap: 8px; }
    .sheet .foot .btn { flex: 1 1 auto; }

    .pick-list { max-height: 46vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }

    .pick-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
    }

    .pick-item:last-child { border-bottom: 0; }
    .pick-item .glyph { font-size: 18px; }
    .pick-item .grow { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #toast {
        position: fixed;
        left: 50%;
        bottom: calc(84px + env(safe-area-inset-bottom));
        transform: translate(-50%, 20px);
        background: rgba(16, 24, 40, .94);
        color: #fff;
        font-size: 13.5px;
        font-weight: 600;
        padding: 11px 16px;
        border-radius: 12px;
        max-width: 88vw;
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s, transform .18s;
        z-index: 120;
        line-height: 1.4;
        text-align: center;
    }

    #toast.on { opacity: 1; transform: translate(-50%, 0); }

    .progress-track {
        height: 8px;
        border-radius: 999px;
        background: #E9EEF7;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width .2s;
    }

    .progress-fill.indeterminate {
        width: 40%;
        animation: slide 1.1s infinite linear;
    }

    @keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }

    .notice {
        background: #FFF7E6;
        border: 1px solid #FFE1A8;
        color: #8A5A00;
        font-size: 12.5px;
        line-height: 1.5;
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 10px;
    }

    .hidden { display: none !important; }
</style>
</head>
<body>

<header id="topbar">
    <div class="brandline">
        <h1>📁 NAS 파일매니저</h1>
        <div class="sub">
            <span class="dot" id="nasDot"></span>
            <span id="nasState">시놀로지 연결 안 됨</span>
        </div>
    </div>
    <nav class="tabs">
        <button class="tab active" data-tab="phone" id="tab-phone">📱 내 폰</button>
        <button class="tab" data-tab="nas" id="tab-nas">🖥️ 시놀로지</button>
        <button class="tab" data-tab="fav" id="tab-fav">⭐ 즐겨찾기</button>
        <button class="tab" data-tab="settings" id="tab-settings">⚙️ 설정</button>
    </nav>
</header>

<main>
    <!-- ------------------------------------------------ browse (phone/nas/fav) -->
    <section class="screen active" id="view-browse">
        <div id="pathbar">
            <button class="icon-btn" id="btnUp" title="위로">←</button>
            <div id="crumbs"></div>
            <button class="icon-btn" id="btnFav" title="즐겨찾기">☆</button>
            <button class="icon-btn" id="btnReload" title="새로고침">⟳</button>
        </div>
        <div id="connect" class="hidden"></div>
        <div id="quick"></div>
        <div id="toolbar">
            <div class="seg" id="filters">
                <button data-filter="all" class="on">전체</button>
                <button data-filter="image">사진</button>
                <button data-filter="video">영상</button>
                <button data-filter="folder">폴더</button>
            </div>
            <select id="sort">
                <option value="name">이름순</option>
                <option value="date">최신순</option>
                <option value="size">크기순</option>
            </select>
            <div id="searchwrap">
                <span>🔍</span>
                <input id="search" type="search" placeholder="이 폴더에서 검색" autocomplete="off">
            </div>
            <button class="icon-btn" id="btnSearch" title="검색">🔍</button>
            <button class="icon-btn" id="btnView" title="보기 전환">▦</button>
            <button class="icon-btn" id="btnNewFolder" title="새 폴더">＋</button>
        </div>
        <div id="statusline"><span id="countText"></span></div>
        <div id="list" class="grid"></div>
        <div id="empty">
            <div class="big">📂</div>
            <div class="title" id="emptyTitle">폴더가 비어 있습니다</div>
            <div class="hint" id="emptyHint">사진이나 영상을 올리면 여기에 보입니다.</div>
            <button class="btn" id="emptyAction" style="display:none"></button>
        </div>
        <div id="selbar"></div>
    </section>

    <!-- --------------------------------------------------------- settings -->
    <section class="screen" id="view-settings">
        <div id="settingsBody"></div>
    </section>
</main>

<!-- photo viewer -->
<div class="overlay" id="viewer">
    <div class="ovtop">
        <button class="ovbtn" id="vClose">✕</button>
        <div class="title" id="vTitle">사진</div>
        <div class="count" id="vCount"></div>
        <button class="ovbtn" id="vExternal" title="외부 앱으로 열기">↗</button>
    </div>
    <div class="stage" id="vStage">
        <img id="vImg" alt="">
    </div>
    <div class="ovbottom">
        <button class="btn" id="vPrev">◀ 이전</button>
        <button class="btn" id="vZoom">1x</button>
        <button class="btn" id="vSave">저장</button>
        <button class="btn" id="vNext">다음 ▶</button>
    </div>
</div>

<!-- video player -->
<div class="overlay" id="player">
    <div class="ovtop">
        <button class="ovbtn" id="pClose">✕</button>
        <div class="title" id="pTitle">동영상</div>
        <button class="ovbtn" id="pExternal" title="외부 플레이어로 열기">↗</button>
    </div>
    <div class="stage" id="pStage">
        <video id="playerVideo" controls playsinline preload="metadata"></video>
        <div id="pLoading" class="hint" style="color:#c7d0de;position:absolute;text-align:center">불러오는 중...</div>
    </div>
    <div class="ovbottom">
        <button class="btn" id="pSave">내 폰에 저장</button>
    </div>
</div>

<div id="modal"><div class="sheet" id="modalSheet"></div></div>
<div id="progress"><div class="sheet" id="progressSheet"></div></div>
<div id="toast"></div>

<script src="core.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
